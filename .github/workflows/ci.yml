name: CI

on:
  # Only PRs, checked as merged with the current main. Pushes to a branch without a PR get no run.
  pull_request:
  # Called by the deploy workflow: nothing gets deployed that fails here
  workflow_call:
    inputs:
      upload-dist:
        description: Upload the built pages as artifact "dist", so the deploy ships exactly what was checked here
        type: boolean
        default: false

# A newer push to the same PR makes the older run pointless. With the workflow name in the group, a run called by a
# deploy never cancels a PR run or the other way around.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checking out is all the token is needed for. Without this, it has the repository's default scope, possibly write
# access, while npm ci runs the install scripts of every dependency. Also limits the run called by the deploy workflow.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Actions are pinned to commit SHAs: a tag can be moved to other code, a SHA can't. Dependabot updates the SHA
    # and the version comment together (.github/dependabot.yml).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Otherwise the token stays on the runner for every later step, npm ci included.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs the typecheck first
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Only when called by the deploy workflow (inputs is empty for push and pull_request)
      - name: Upload pages for the deploy
        if: inputs.upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
