name: Deploy

on:
  push:
    tags:
      - 'v*'
  # "Run workflow" button in the Actions tab
  workflow_dispatch:

# Never run two deploys at the same time
concurrency: deploy

jobs:
  # Signaling server on the VPS. Every deploy restarts it, which drops all open rooms.
  deploy-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy signaling server via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted to deploy/apiracer-deploy.sh on the VPS, the SHA is its only argument
          ssh relay@relay.messy-desk-studio.de "$SHA"

  build-and-deploy:
    # Only ship a frontend if the server it talks to was deployed successfully
    needs: deploy-relay
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stud.messy-desk-studio.de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Also runs the typecheck, so type errors stop the deploy
      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /stud.messy-desk-studio.de/httpdocs/
          protocol: ftps
          port: 21
          dangerous-clean-slate: false
