<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApiRacer · Controller</title>
  </head>
  <body>
    <main>
      <h1>📱 ApiRacer Controller</h1>
      
      <button id="gyroPermissionButton">Device Gyro Permission</button>
      <form id="join-form" class="join-form">
        <label>
          Raumcode
          <input id="room-input" maxlength="4" autocapitalize="characters" autocomplete="off" required />
        </label>
        <button type="submit">Beitreten</button>
      </form>

      <section id="session" hidden>
        <p class="status" id="status">…</p>
        <dl>
          <dt>Raum</dt><dd id="room">–</dd>
          <dt>Peer-ID</dt><dd id="peer-id">–</dd>
          <dt>Verbindungsweg</dt><dd id="path">–</dd>
          <dt>Alpha (Drehung)</dt><dd id="orientation-alpha">–</dd>
          <dt>Beta (vor/zurück)</dt><dd id="orientation-beta">–</dd>
          <dt>Gamma (links/rechts)</dt><dd id="orientation-gamma">–</dd>
        </dl>
        <button id="hello-btn" class="big" disabled>👋 Hallo senden</button>
      </section>

      <section>
        <h2>Protokoll</h2>
        <ol id="log" class="log"></ol>
      </section>
    </main>
    <script type="module" src="/src/client/controller.ts"></script>
  </body>
</html>
