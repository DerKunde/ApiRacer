<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Status symbols, drawn around (0, 0) -->
    <g id="works">
      <path d="M -7 0 L -2 5 L 8 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="nodata">
      <circle r="8" fill="none" stroke="#f5c542" stroke-width="1.6"/>
      <line x1="0" y1="-4" x2="0" y2="1.5" stroke="#f5c542" stroke-width="1.8" stroke-linecap="round"/>
      <circle cy="4.5" r="1.1" fill="#f5c542"/>
    </g>
    <g id="missing">
      <circle r="8" fill="none" stroke="#ff6b6b" stroke-width="1.6"/>
      <path d="M -3.5 -3.5 L 3.5 3.5 M 3.5 -3.5 L -3.5 3.5" stroke="#ff6b6b" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="required">
      <circle r="8" fill="none" stroke="#7ab8ff" stroke-width="1.6"/>
      <circle cy="-4" r="1.1" fill="#7ab8ff"/>
      <line x1="0" y1="-1" x2="0" y2="4.5" stroke="#7ab8ff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="notneeded">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#8f8f9d" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Device icons -->
    <g id="desktop" fill="none" stroke="#fbfbfe" stroke-width="1.4" stroke-linejoin="round">
      <rect x="-9" y="-8" width="18" height="12" rx="1.5"/>
      <path d="M -3 8 L 3 8 M 0 4 L 0 8"/>
    </g>
    <g id="mobile" fill="none" stroke="#fbfbfe" stroke-width="1.4">
      <rect x="-5.5" y="-9" width="11" height="18" rx="2"/>
      <line x1="-1.5" y1="6" x2="1.5" y2="6"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="760" height="640" fill="#1b1b1b"/>
  <rect x="10.5" y="10.5" width="739" height="564" rx="4" fill="none" stroke="#3d3d3d"/>

  <!-- Grid lines: columns -->
  <g stroke="#3d3d3d">
    <line x1="310.5" y1="10" x2="310.5" y2="575"/>
    <line x1="420.5" y1="50" x2="420.5" y2="575"/>
    <line x1="530.5" y1="10" x2="530.5" y2="575"/>
    <line x1="640.5" y1="50" x2="640.5" y2="575"/>
    <!-- rows -->
    <line x1="310" y1="50.5" x2="750" y2="50.5"/>
    <line x1="10" y1="190.5" x2="750" y2="190.5"/>
    <line x1="10" y1="222.5" x2="750" y2="222.5"/>
    <line x1="10" y1="286.5" x2="750" y2="286.5"/>
    <line x1="10" y1="350.5" x2="750" y2="350.5"/>
    <line x1="10" y1="414.5" x2="750" y2="414.5"/>
    <line x1="10" y1="478.5" x2="750" y2="478.5"/>
    <line x1="10" y1="510.5" x2="750" y2="510.5"/>
  </g>

  <!-- Device group headers -->
  <use href="#desktop" x="420" y="30"/>
  <use href="#mobile" x="640" y="30"/>

  <!-- Browser names (rotated, MDN style) -->
  <g fill="#fbfbfe" font-size="14" font-weight="600">
    <text transform="translate(362 180) rotate(-90)">Chrome</text>
    <text transform="translate(472 180) rotate(-90)">Firefox</text>
    <text transform="translate(582 180) rotate(-90)">Safari</text>
    <text transform="translate(692 180) rotate(-90)">Chrome</text>
  </g>
  <g fill="#8f8f9d" font-size="12">
    <text transform="translate(380 180) rotate(-90)">138 · Windows</text>
    <text transform="translate(490 180) rotate(-90)">157 · Windows</text>
    <text transform="translate(600 180) rotate(-90)">iPhone 13 Pro Max</text>
    <text transform="translate(710 180) rotate(-90)" font-style="italic">Android (docs)</text>
  </g>

  <!-- Group rows -->
  <rect x="11" y="191" width="738" height="31" fill="#232323"/>
  <text x="22" y="211" fill="#fbfbfe" font-size="14" font-weight="600">Device Orientation Events</text>
  <rect x="11" y="479" width="738" height="31" fill="#232323"/>
  <text x="22" y="499" fill="#fbfbfe" font-size="14" font-weight="600">Generic Sensor API</text>

  <!-- Feature names -->
  <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#fbfbfe">
    <rect x="22" y="241" width="142" height="24" rx="4" fill="#343434"/>
    <text x="30" y="258" textLength="126" lengthAdjust="spacingAndGlyphs">deviceorientation</text>
    <text x="172" y="258" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">event</text>

    <rect x="22" y="305" width="201" height="24" rx="4" fill="#343434"/>
    <text x="30" y="322" textLength="185" lengthAdjust="spacingAndGlyphs">deviceorientationabsolute</text>
    <text x="231" y="322" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">event</text>

    <rect x="22" y="369" width="157" height="24" rx="4" fill="#343434"/>
    <text x="30" y="386" textLength="141" lengthAdjust="spacingAndGlyphs">requestPermission()</text>

    <rect x="22" y="433" width="164" height="24" rx="4" fill="#343434"/>
    <text x="30" y="450" textLength="148" lengthAdjust="spacingAndGlyphs">webkitCompassHeading</text>
    <text x="22" y="471" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8f8f9d">WebKit extension, not in the spec</text>

    <rect x="22" y="529" width="201" height="24" rx="4" fill="#343434"/>
    <text x="30" y="546" textLength="185" lengthAdjust="spacingAndGlyphs">AbsoluteOrientationSensor</text>
  </g>

  <!-- Cells: x centers 365 / 475 / 585 / 695 -->
  <g font-size="12" text-anchor="middle">
    <!-- deviceorientation -->
    <use href="#nodata" x="365" y="246"/><text x="365" y="274" fill="#f5c542">No data</text>
    <use href="#nodata" x="475" y="246"/><text x="475" y="274" fill="#f5c542">No data</text>
    <use href="#works" x="585" y="246"/><text x="585" y="274" fill="#4ade80">Works</text>
    <use href="#works" x="695" y="246"/><text x="695" y="274" fill="#4ade80">Works</text>

    <!-- deviceorientationabsolute -->
    <use href="#nodata" x="365" y="310"/><text x="365" y="338" fill="#f5c542">No data</text>
    <use href="#nodata" x="475" y="310"/><text x="475" y="338" fill="#f5c542">No data</text>
    <use href="#missing" x="585" y="310"/><text x="585" y="338" fill="#ff6b6b">No</text>
    <use href="#works" x="695" y="310"/><text x="695" y="338" fill="#4ade80">Works</text>

    <!-- requestPermission() -->
    <use href="#notneeded" x="365" y="374"/><text x="365" y="402" fill="#8f8f9d">Not needed</text>
    <use href="#notneeded" x="475" y="374"/><text x="475" y="402" fill="#8f8f9d">Not needed</text>
    <use href="#required" x="585" y="374"/><text x="585" y="402" fill="#7ab8ff">Required</text>
    <use href="#notneeded" x="695" y="374"/><text x="695" y="402" fill="#8f8f9d">Not needed</text>

    <!-- webkitCompassHeading -->
    <use href="#missing" x="365" y="438"/><text x="365" y="466" fill="#ff6b6b">No</text>
    <use href="#missing" x="475" y="438"/><text x="475" y="466" fill="#ff6b6b">No</text>
    <use href="#works" x="585" y="438"/><text x="585" y="466" fill="#4ade80">Works</text>
    <use href="#missing" x="695" y="438"/><text x="695" y="466" fill="#ff6b6b">No</text>

    <!-- AbsoluteOrientationSensor -->
    <use href="#nodata" x="365" y="534"/><text x="365" y="562" fill="#f5c542">No data</text>
    <use href="#missing" x="475" y="534"/><text x="475" y="562" fill="#ff6b6b">No</text>
    <use href="#missing" x="585" y="534"/><text x="585" y="562" fill="#ff6b6b">No</text>
    <use href="#works" x="695" y="534"/><text x="695" y="562" fill="#4ade80">Works</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#cfcfd8">
    <use href="#works" x="24" y="606"/><text x="40" y="610">Works: delivers real values</text>
    <use href="#nodata" x="216" y="606"/><text x="232" y="610">No data: exists, delivers nothing</text>
    <use href="#missing" x="444" y="606"/><text x="460" y="610">Not available</text>
    <use href="#required" x="568" y="606"/><text x="584" y="610">Permission prompt</text>
  </g>
</svg>
