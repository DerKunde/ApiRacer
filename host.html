<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApiRacer · Rennen (Host)</title>
  </head>
  <body>
    <main class="dashboard">
      <h1 class="dashboard-title">Rennen Host</h1>

      <!-- <details> = native collapsible, no JS: click on the summary toggles the "open" attribute -->
      <details class="dashboard-join" open>
        <summary><h2>Verbinden</h2></summary>
        <p class="room-line">Raumcode <span class="room-code" id="room-code">…</span></p>
        <ul id="join-links" class="links"></ul>
      </details>

      <section class="dashboard-view">
        <h2>Rennen</h2>
        <!-- Enabled by updateStartButton in host.ts once every racer is ready; setPhase swaps it for the end button -->
        <p class="race-start">
          <button type="button" id="start-btn" disabled>Rennen starten</button>
          <button type="button" id="end-btn" hidden>Rennen beenden</button>
          <span id="ready-count">Warte auf Fahrer …</span>
          <!-- Engine sound, applied and remembered by setupVolumeSlider in host.ts -->
          <label class="race-volume">Lautstärke <input type="range" id="volume" min="0" max="100" value="100" /></label>
        </p>
        <div id="race-view"></div>
      </section>

      <section class="dashboard-peers">
        <h2>Verbundene Handys</h2>
        <ul id="peers" class="peer-list"></ul>
      </section>

      <section class="dashboard-log">
        <h2>Protokoll</h2>
        <ol id="log" class="log"></ol>
      </section>
    </main>
    <script type="module" src="/src/client/race/host.ts"></script>
  </body>
</html>
