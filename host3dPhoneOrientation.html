<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApiRacer · 3D-Handy (Host)</title>
  </head>
  <body>
    <main class="dashboard">
      <h1 class="dashboard-title">🖥️ ApiRacer 3D-Handy</h1>

      <!-- <details> = native collapsible, no JS: click on the summary toggles the "open" attribute -->
      <details class="dashboard-join" open>
        <summary><h2>Verbinden</h2></summary>
        <p class="room-line">Raumcode <span class="room-code" id="room-code">…</span></p>
        <ul id="join-links" class="links"></ul>
      </details>

      <section class="dashboard-view">
        <h2>Ansicht</h2>
        <div id="orientation-view"></div>
      </section>

      <section class="dashboard-peers">
        <h2>Verbundene Handys</h2>
        <ul id="peers" class="peer-list"></ul>
      </section>

      <section class="dashboard-log">
        <h2>Protokoll</h2>
        <ol id="log" class="log"></ol>
      </section>
    </main>
    <script type="module" src="/src/client/host3dPhoneOrientation.ts"></script>
  </body>
</html>
